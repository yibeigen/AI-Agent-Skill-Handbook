<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <radialGradient id="glowTopRight" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowTopRight)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowBottomLeft)"/>

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Abstract Tech Grid & Nodes -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="280" y1="0" x2="280" y2="420"/>
    <line x1="920" y1="0" x2="920" y2="420"/>
    <line x1="1120" y1="0" x2="1120" y2="420"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
  </g>

  <!-- Glowing Badge on Top -->
  <g transform="translate(470, 48)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="20" cy="16" r="4" fill="#38bdf8"/>
    <text x="34" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
      OPEN SOURCE HANDBOOK
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="44" font-weight="800" letter-spacing="1">
    AI Agent Skill 架构与生产级实战全书
  </text>

  <!-- Subtitle -->
  <text x="600" y="192" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="400" letter-spacing="0.5">
    从零到一打造自主技能与开源资产 · 专治 Vibe Coding 时代的工程失控
  </text>

  <!-- Golden Quote Pill -->
  <g transform="translate(240, 222)">
    <rect width="720" height="40" rx="20" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="360" y="25" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="14" font-weight="500">
      “ 在工程中，每一行多余的代码都是未来的负债。Skill 是给 AI 发放的上岗资格证。 ”
    </text>
  </g>

  <!-- Feature Cards Row -->
  <g transform="translate(140, 290)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="14" font-weight="700">01. Meta-Prompt</text>
      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12">五维元提示词自动生成模具</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(235, 0)">
      <rect width="210" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="14" font-weight="700">02. Code-Slim 源码</text>
      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12">12级价值天平防腐护栏</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(470, 0)">
      <rect width="210" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="14" font-weight="700">03. 双层复盘自愈</text>
      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12">终结 AI 换窗口失忆顽疾</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(705, 0)">
      <rect width="210" height="80" rx="10" fill="url(#cardBg)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="34" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="14" font-weight="700">04. 外置状态机</text>
      <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12">复杂长任务防脱轨编排</text>
    </g>
  </g>
</svg>
